name: Deploy TZMICHA AI OS → voice.tzmicha.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            # Clone on first deploy, pull on subsequent
            if [ ! -d "/opt/voice-ai/.git" ]; then
               git clone https://github.com/tzmichasureshmd-bit/Voice_Agent_Engine.git /opt/voice-ai
            fi

            cd /opt/voice-ai
            git pull origin main

            # Write .env from GitHub Secret
            echo "${{ secrets.ENV_PRODUCTION }}" > /opt/voice-ai/.env

            # Build & restart with prod compose
            cd /opt/voice-ai
            docker compose -f deploy/docker-compose.prod.yml down --remove-orphans
            docker compose -f deploy/docker-compose.prod.yml build --no-cache
            docker compose -f deploy/docker-compose.prod.yml up -d

            echo "✅ TZMICHA AI OS deployed!"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
