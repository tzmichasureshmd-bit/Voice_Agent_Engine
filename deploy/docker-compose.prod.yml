# TZMICHA AI OS — Production Docker Compose
# voice.tzmicha.com | Hostinger KNM2 | 200.97.174.56

services:
  voice-backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: voice-backend
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - voice_data:/app/data
      - tts_models:/root/.local/share/tts
    networks:
      - voice-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  voice-frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: voice-frontend
    restart: unless-stopped
    depends_on:
      - voice-backend
    networks:
      - voice-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voice.rule=Host(`voice.tzmicha.com`)"
      - "traefik.http.routers.voice.entrypoints=websecure"
      - "traefik.http.routers.voice.tls.certresolver=letsencrypt"
      - "traefik.http.services.voice.loadbalancer.server.port=80"

volumes:
  voice_data:
    driver: local
  tts_models:
    driver: local

networks:
  voice-net:
    driver: bridge
  traefik-net:
    external: true
    name: traefik-net
