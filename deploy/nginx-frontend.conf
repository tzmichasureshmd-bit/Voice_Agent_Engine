server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API proxy → backend container
    location /api/ {
        proxy_pass http://voice-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        # CORS for API
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        # Allow Google OAuth popup to work
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # API docs
    location /docs {
        proxy_pass http://voice-backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://voice-backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Frontend SPA — all routes go to index.html
    # Google OAuth popup fix: COOP only on SPA, not on /api/
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        try_files $uri $uri/ /index.html;
    }
}
