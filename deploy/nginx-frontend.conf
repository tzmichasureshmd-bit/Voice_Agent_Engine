server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Frontend SPA — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Required for Google OAuth popup
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # API proxy → backend container
    location /api/ {
        proxy_pass http://voice-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # API docs
    location /docs {
        proxy_pass http://voice-backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://voice-backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
